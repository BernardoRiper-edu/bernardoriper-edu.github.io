{% comment %} Botão "Agendar aula": abre o calendário numa janela por cima da página.
Sem JavaScript, abre o Calendly normalmente. Parâmetros opcionais: texto, classe {% endcomment %}
<a href="{{ site.calendly_url }}" class="{{ include.classe | default: 'btn' }} btn-icon" data-agendar target="_blank" rel="noopener">{% include icone.html nome="calendario" %}<span>{{ include.texto | default: "Agendar aula" }}</span></a>
