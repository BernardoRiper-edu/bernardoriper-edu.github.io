# =================================================================
#  ESCOLA ATUAL — mude só este arquivo quando trocar de colégio.
#  Nome, cores e materiais se ajustam no site inteiro.
# =================================================================

nome: "TBS"                     # nome completo, se quiser (ex.: "The British School")
sigla: "TBS"                    # aparece no menu, nos filtros e nas etiquetas
funcao: "assistant teacher"     # seu papel na escola
logo: ""                        # opcional, ex.: /assets/img/logo-escola.png

# -----------------------------------------------------------------
#  PALETA — 5 cores em hexadecimal.
#  Coloque aqui as cores do colégio (as do logo ou do uniforme).
#  Os valores abaixo são provisórios: troque pelas cores da TBS.
# -----------------------------------------------------------------
cores:
  principal: "#1d3a6e"   # botões, links, faixa de chamada no fim da página
  destaque:  "#e8b923"   # marca-texto: etiquetas, aba dos cards, título da página
                         # (use uma cor clara ou viva: o texto fica escuro por cima dela)
  texto:     "#14182b"   # títulos e texto
  fundo:     "#f4f6fb"   # fundo das páginas
  linhas:    "#dde3f0"   # quadriculado e bordas

# true  → a paleta da escola vale para o site inteiro
# false → só a página da escola (e os avisos dela) usam essas cores;
#         as páginas de aulas particulares mantêm o visual padrão
aplicar_no_site_todo: false

# -----------------------------------------------------------------
#  CONTEÚDO DA PÁGINA /escola/
#  Itens com "url" vazio aparecem como "em breve".
# -----------------------------------------------------------------
intro: >
  Espaço de apoio para os alunos e turmas em que atuo como assistant teacher:
  materiais de aula, listas de exercícios, avisos e horários de plantão.

plantao:
  texto: "Consulte o horário do plantão com o professor da turma."
  url: ""   # opcional: link de agendamento do plantão

# -----------------------------------------------------------------
#  HORÁRIOS DE CLINICS — imagem que abre ao clicar em "Horários de Clinics"
#  no menu do topo. Troque o arquivo (mesmo nome) quando os horários mudarem.
#  Enquanto o arquivo não existir, a janela mostra "ainda não foram publicados".
# -----------------------------------------------------------------
clinics:
  imagem: /assets/escola/horarios-clinics.png

# -----------------------------------------------------------------
#  MATERIAIS POR ANO
#  Os arquivos ficam em assets/materiais/<ano>/<tipo>/ — por exemplo:
#    assets/materiais/Y9/lista/Lista 03 - Cinematica.pdf
#  O site lista sozinho o que estiver em cada pasta (não precisa editar nada aqui).
#  O nome do arquivo é o que os alunos veem: use nomes claros.
# -----------------------------------------------------------------
materiais:
  pasta: "/assets/materiais/"
  anos: ["Y7", "Y8", "Y9", "Y10", "Y11", "Y12", "Y13"]
  tipos:
    - pasta: "material"
      titulo: "Materiais de aula"
    - pasta: "lista"
      titulo: "Listas de exercícios"
    - pasta: "gabarito"
      titulo: "Gabaritos"

  # Quadrado "Todos", depois dos anos: materiais para qualquer turma.
  # Os livros ficam em assets/materiais/Todos/livros/ e abrem no mesmo visualizador.
  todos:
    nome: "Todos"
    tipos:
      - pasta: "livros"
        titulo: "Livros"
    youtube: ""   # cole aqui o link do canal; enquanto estiver vazio aparece "em breve"

links_uteis:
  - titulo: "Calendário escolar"
    url: ""
  - titulo: "Plataforma da escola (Classroom / Teams)"
    url: ""
