---
layout: default
title: Bernardo Riper
---

<section id="calendario" class="section">
  <h2>Calendário</h2>

  <!-- Calendly inline embed -->
  <div class="calendly-inline-widget"
       data-url="https://calendly.com/bernardoriper-edu/new-meeting?hide_gdpr_banner=1"
       style="min-width:320px;height:700px;">
  </div>
  <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
</section>

<section id="artigos" class="section">
  <h2>Artigos</h2>

  <div class="grid">
    {% assign sorted_articles = site.articles | sort: "date" | reverse %}
    {% for a in sorted_articles %}
      <a class="card {{ a.size | default: 'card-normal' }}" href="{{ a.url | relative_url }}" style="{% if a.color %}background:{{ a.color }};{% endif %}">
        {% if a.image %}
          <img src="{{ a.image | relative_url }}" alt="{{ a.title }}">
        {% endif %}
        <div class="card-body">
          <h3>{{ a.title }}</h3>
          {% if a.summary %}<p>{{ a.summary }}</p>{% endif %}
        </div>
      </a>
    {% endfor %}
  </div>
</section>
